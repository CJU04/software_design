name: vetcare_connect
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  shared_preferences: ^2.1.2
  path: ^1.8.3
  path_provider: ^2.0.17
  sembast_web: ^2.4.4+1

  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2

  provider: ^6.1.2

  image_picker: ^1.0.7
  fluttertoast: ^9.0.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  table_calendar: ^3.1.2
  uuid: ^4.5.1
  cloud_functions: ^6.3.2
  firebase_app_check: ^0.4.4+2
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'assets/logo.png'
  output_path: 'android/app/src/main/res'
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: 'assets/logo.png'